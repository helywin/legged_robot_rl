[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legged-robot-rl-learning"
version = "0.1.0"
description = "从表格 Q-learning 到 DQN 游戏与四足机器人强化学习的入门课程和实验"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gymnasium[classic-control]>=1.3,<2"]

[project.optional-dependencies]
dev = ["PyYAML>=6.0"]
dqn = ["torch>=2.13,<3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["examples*", "exercises*"]
namespaces = false
